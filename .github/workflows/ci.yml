name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npx playwright test tests/e2e/packaged.spec.js
        env:
          FLOATNOTE_TEST_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\Floatnote.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Floatnote-Windows
          path: release/Floatnote-Setup-*.exe
          if-no-files-found: error
